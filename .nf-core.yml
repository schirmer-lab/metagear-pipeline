lint:
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-metagear-pipeline_logo_light.png
    - docs/images/nf-core-metagear-pipeline_logo_light.png
    - docs/images/nf-core-metagear-pipeline_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-metagear-pipeline_logo_light.png
    - docs/images/nf-core-metagear-pipeline_logo_light.png
    - docs/images/nf-core-metagear-pipeline_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    # The rendered template points support links at an nf-core Slack channel
    # named after the pipeline. This pipeline is not an nf-core pipeline
    # (is_nfcore: false), so no such channel exists and the file intentionally
    # diverges from the template.
    - .github/ISSUE_TEMPLATE/config.yml
    - .gitignore
  included_configs: false
  multiqc_config:
    - report_comment
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
    # Load-bearing for the metagear-tools wrapper's resource-override architecture:
    # max_cpus / max_memory / max_time are real params here (declared in
    # nextflow_schema.json) consumed by process.resourceLimits and the
    # executor.cpus/memory caps. nf-core 3.x deprecates these in favour of
    # literal resourceLimits, but our wrapper architecture relies on params
    # so the user can override them in $INSTALL_DIR/metagear.config.
    - params.max_cpus
    - params.max_memory
    - params.max_time
nf_core_version: 4.0.2
repository_type: pipeline
template:
  author: Emilio Rios, Shen Jin
  description: "Integrated shotgun metagenomics — profiles, gene catalogs, MAGs, viruses and pangenomes"
  force: false
  is_nfcore: false
  name: metagear
  org: schirmer-lab
  outdir: .
  skip_features:
    - igenomes
    - fastqc
  version: "26.09"
