name: Test successful pipeline download with 'nf-core pipelines download'

# Run the workflow when:
#  - dispatched manually
#  - when a PR is opened or reopened to main/master branch
#  - the head branch of the pull request is updated, i.e. if fixes for a release are pushed last minute to dev.
on:
  workflow_dispatch:
    inputs:
      testbranch:
        description: "The specific branch you wish to utilize for the test execution of nf-core pipelines download."
        required: true
        default: "dev"
      container_system:
        description: "Download container images too. 'none' checks packaging only; 'singularity' needs ~35 GB of disk."
        required: false
        default: "none"
        type: choice
        options:
          - none
          - singularity
  pull_request:
    branches:
      - main
      - master

env:
  NXF_ANSI_LOG: false
  # The pipeline uses interpolated include paths (`from "$projectDir/..."`), which the strict
  # parser rejects; `nf-core pipelines download` shells out to `nextflow inspect`, so without
  # this the download test fails to compile main.nf. Every real run sets the same thing.
  NXF_SYNTAX_PARSER: v1

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      REPO_LOWERCASE: ${{ steps.get_repo_properties.outputs.REPO_LOWERCASE }}
      REPOTITLE_LOWERCASE: ${{ steps.get_repo_properties.outputs.REPOTITLE_LOWERCASE }}
      REPO_BRANCH: ${{ steps.get_repo_properties.outputs.REPO_BRANCH }}
      CONTAINER_SYSTEM: ${{ steps.get_repo_properties.outputs.CONTAINER_SYSTEM }}
    steps:
      - name: Get the repository name and current branch
        id: get_repo_properties
        run: |
          echo "REPO_LOWERCASE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "REPOTITLE_LOWERCASE=$(basename ${GITHUB_REPOSITORY,,})" >> "$GITHUB_OUTPUT"
          # On a pull request, test the branch under review. The template hardcodes 'dev',
          # which means a PR fixing this job cannot demonstrate the fix -- the run downloads
          # dev regardless of what the PR changes.
          echo "REPO_BRANCH=${{ github.event.inputs.testbranch || github.head_ref || 'dev' }}" >> "$GITHUB_OUTPUT"
          # Pull requests check packaging only. This pipeline's 48 images total ~35 GB -- InterProScan
          # alone is 18.8 GB -- which does not fit a hosted runner's ~14 GB of free disk. Dispatch the
          # workflow manually with container_system=singularity to exercise the full offline bundle.
          echo "CONTAINER_SYSTEM=${{ github.event.inputs.container_system || 'none' }}" >> "$GITHUB_OUTPUT"

  download:
    runs-on: ubuntu-latest
    needs: configure
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@b4ec1bc7c16a94435159de94a05253542fddf6ef # v3

      - name: Disk space cleanup
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Setup Apptainer
        uses: eWaterCycle/setup-apptainer@4bb22c52d4f63406c49e94c804632975787312b3 # v2.0.0
        with:
          apptainer-version: 1.3.4

      - name: Read .nf-core.yml
        id: read_yml
        run: |
          echo "nf_core_version=$(yq '.nf_core_version' ${{ github.workspace }}/.nf-core.yml)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nf-core==${{ steps.read_yml.outputs['nf_core_version'] }}

      - name: Make a cache directory for the container images
        run: |
          mkdir -p ./singularity_container_images

      - name: Download the pipeline
        env:
          NXF_SINGULARITY_CACHEDIR: ./singularity_container_images
        run: |
          # The container library and cache flags only apply when images are being fetched.
          # Passing them with --container-system none makes nf-core warn, then prompt
          # "Do you want to download singularity images?", which aborts with no TTY.
          container_args=()
          if [ "${{ needs.configure.outputs.CONTAINER_SYSTEM }}" != "none" ]; then
            container_args=(
              --container-library "quay.io"
              -l "docker.io"
              -l "community.wave.seqera.io/library/"
              --container-cache-utilisation 'amend'
            )
          fi
          nf-core pipelines download ${{ needs.configure.outputs.REPO_LOWERCASE }} \
          --revision ${{ needs.configure.outputs.REPO_BRANCH }} \
          --outdir ./${{ needs.configure.outputs.REPOTITLE_LOWERCASE }} \
          --compress "none" \
          --container-system '${{ needs.configure.outputs.CONTAINER_SYSTEM }}' \
          "${container_args[@]}" \
          --download-configuration 'yes'

      - name: Inspect download
        run: tree ./${{ needs.configure.outputs.REPOTITLE_LOWERCASE }}

      # Keeps the check that actually catches bugs when images are not downloaded.
      # `nf-core pipelines download` only resolves container URIs when it is fetching them
      # (download.py:333), so with container_system=none nothing would validate them --
      # and a malformed URI is exactly what broke this job before.
      - name: Resolve every container URI
        if: needs.configure.outputs.CONTAINER_SYSTEM == 'none'
        run: |
          cd ./${{ needs.configure.outputs.REPOTITLE_LOWERCASE }}/$( sed 's/\W/_/g' <<< ${{ needs.configure.outputs.REPO_BRANCH }})
          nextflow inspect -format json -profile test,singularity main.nf > /tmp/inspect.json
          python3 - <<'EOF'
          import json, sys
          raw = open('/tmp/inspect.json').read()
          data, _ = json.JSONDecoder().raw_decode(raw[raw.index('{'):])
          procs = data.get('processes', [])
          bad = [(p['name'], p['container']) for p in procs
                 if str(p.get('container', '')).count('://') > 1
                 or str(p.get('container', '')).startswith('library://')]
          print(f"resolved {len(procs)} processes")
          if bad:
              for n, c in bad:
                  print(f"unpullable container in {n}: {c}")
              sys.exit(1)
          print("all container URIs are well formed")
          EOF

      - name: Inspect container images
        if: needs.configure.outputs.CONTAINER_SYSTEM != 'none'
        run: tree ./singularity_container_images | tee ./container_initial

      - name: Count the downloaded number of container images
        id: count_initial
        if: needs.configure.outputs.CONTAINER_SYSTEM != 'none'
        run: |
          image_count=$(ls -1 ./singularity_container_images | wc -l | xargs)
          echo "Initial container image count: $image_count"
          echo "IMAGE_COUNT_INITIAL=$image_count" >> "$GITHUB_OUTPUT"

      - name: Run the downloaded pipeline (stub)
        if: needs.configure.outputs.CONTAINER_SYSTEM != 'none'
        id: stub_run_pipeline
        continue-on-error: true
        env:
          NXF_SINGULARITY_CACHEDIR: ./singularity_container_images
          NXF_SINGULARITY_HOME_MOUNT: true
        run: nextflow run ./${{needs.configure.outputs.REPOTITLE_LOWERCASE }}/$( sed 's/\W/_/g' <<< ${{ needs.configure.outputs.REPO_BRANCH }}) -stub -profile test,singularity --outdir ./results
      - name: Run the downloaded pipeline (stub run not supported)
        id: run_pipeline
        if: needs.configure.outputs.CONTAINER_SYSTEM != 'none' && steps.stub_run_pipeline.outcome == 'failure'
        env:
          NXF_SINGULARITY_CACHEDIR: ./singularity_container_images
          NXF_SINGULARITY_HOME_MOUNT: true
        run: nextflow run ./${{ needs.configure.outputs.REPOTITLE_LOWERCASE }}/$( sed 's/\W/_/g' <<< ${{ needs.configure.outputs.REPO_BRANCH }}) -profile test,singularity --outdir ./results

      - name: Count the downloaded number of container images
        id: count_afterwards
        if: needs.configure.outputs.CONTAINER_SYSTEM != 'none'
        run: |
          image_count=$(ls -1 ./singularity_container_images | wc -l | xargs)
          echo "Post-pipeline run container image count: $image_count"
          echo "IMAGE_COUNT_AFTER=$image_count" >> "$GITHUB_OUTPUT"

      - name: Compare container image counts
        if: needs.configure.outputs.CONTAINER_SYSTEM != 'none'
        id: count_comparison
        run: |
          if [ "${{ steps.count_initial.outputs.IMAGE_COUNT_INITIAL }}" -ne "${{ steps.count_afterwards.outputs.IMAGE_COUNT_AFTER }}" ]; then
            initial_count=${{ steps.count_initial.outputs.IMAGE_COUNT_INITIAL }}
            final_count=${{ steps.count_afterwards.outputs.IMAGE_COUNT_AFTER }}
            difference=$((final_count - initial_count))
            echo "$difference additional container images were \n downloaded at runtime . The pipeline has no support for offline runs!"
            tree ./singularity_container_images > ./container_afterwards
            diff ./container_initial ./container_afterwards
            exit 1
          else
            echo "The pipeline can be downloaded successfully!"
          fi

      - name: Upload Nextflow logfile for debugging purposes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nextflow_logfile.txt
          path: .nextflow.log*
          include-hidden-files: true
